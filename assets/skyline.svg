<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">

    <style>
      .bg { fill: #0d1117; }
      text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; }
      .title { fill: #6e7681; font-size: 12.5px; }
      .label { fill: #c9d1d9; font-size: 12px; }
      .scene {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sway 7s ease-in-out infinite;
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-2.2deg); }
        50% { transform: rotate(2.2deg); }
      }
      .win { animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.9; }
      }
      .rise { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise {
        from { transform: scaleY(0); }
        to   { transform: scaleY(1); }
      }
    </style>
    
  <rect class="bg" x="0" y="0" width="720" height="340" rx="10"/>
  <text class="title" x="16" y="26">$ du -h --languages ~/sarthakyerane</text>
