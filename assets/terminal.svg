<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" viewBox="0 0 760 224">

    <style>
      .term-bg { fill: #0d1117; }
      .titlebar { fill: #161b22; }
      text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 15px; }
      .prompt { fill: #39d353; font-weight: 600; }
      .out { fill: #c9d1d9; }
      .glow { filter: drop-shadow(0 0 3px rgba(57,211,83,0.6)); }

      .frame {
        fill: none; stroke: #39d353; stroke-opacity: 0.35; stroke-width: 1.5;
        animation: pulse 3.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { stroke-opacity: 0.15; }
        50% { stroke-opacity: 0.5; }
      }

      .scan { animation: drift 6s linear infinite; }
      @keyframes drift {
        from { transform: translateY(0); }
        to   { transform: translateY(4px); }
      }

      .cursor { fill: #39d353; opacity: 0; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
    <style>@keyframes type0 { from { width: 0; } to { width: 89.2px; } }
.type0 { animation: type0 0.29s steps(8, end) forwards; animation-delay: 0.30s; }
@keyframes type1 { from { width: 0; } to { width: 574.1px; } }
.type1 { animation: type1 2.18s steps(61, end) forwards; animation-delay: 0.77s; }
@keyframes type2 { from { width: 0; } to { width: 16.0px; } }
.type2 { animation: type2 0.12s steps(1, end) forwards; animation-delay: 3.12s; }
@keyframes type3 { from { width: 0; } to { width: 89.2px; } }
.type3 { animation: type3 0.29s steps(8, end) forwards; animation-delay: 3.30s; }
@keyframes type4 { from { width: 0; } to { width: 263.1px; } }
.type4 { animation: type4 0.96s steps(27, end) forwards; animation-delay: 3.77s; }
.cursor { animation: cursor-in 0.15s ease forwards 4.91s, blink 0.9s steps(1) infinite 4.91s; }
@keyframes cursor-in { to { opacity: 1; } }</style>
