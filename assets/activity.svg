<svg xmlns="http://www.w3.org/2000/svg" width="620" height="228" viewBox="0 0 620 228">

    <style>
      .bg { fill: #0d1117; }
      text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace; font-size: 13.5px; }
      .title { fill: #c9d1d9; }
      .amber { fill: #ffa657; }
      .dim { fill: #6e7681; }
      .row { opacity: 0; animation: in 0.4s ease forwards; }
      @keyframes in { to { opacity: 1; } }
      .dot { animation: blink 1.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      .frame {
        fill: none; stroke: #ffa657; stroke-opacity: 0.3; stroke-width: 1.5;
        animation: pulse 3.2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { stroke-opacity:.12; } 50% { stroke-opacity:.4; } }
    </style>
    
  <rect class="bg" x="0" y="0" width="620" height="228" rx="10"/>
